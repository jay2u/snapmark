<!doctype html>
<html>
<head><meta charset="utf-8"><title>Snapmark</title><link rel="stylesheet" href="./popup.css"></head>
<body>
  <header><b>Snapmark</b><span class="sub">Screenshot &amp; annotate</span></header>
  <div id="notice" class="notice" hidden></div>
  <div id="error" class="error" hidden>
    <b id="errWhat"></b>
    <p id="errMsg"></p>
    <details><summary>Details</summary><code id="errDetail"></code></details>
  </div>
  <main>
    <button data-mode="visible"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg><span>Visible area</span><kbd>Alt+Shift+V</kbd></button>
    <button data-mode="region"><svg viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4" /><rect x="9" y="9" width="6" height="6" stroke-dasharray="2 2"/></svg><span>Selected region</span><kbd>Alt+Shift+S</kbd></button>
    <button data-mode="full"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 7v10m-3-3 3 3 3-3"/></svg><span>Full page</span><kbd>Alt+Shift+F</kbd></button>
    <button data-mode="desktop"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Window / desktop</span><kbd>Alt+Shift+D</kbd></button>
  </main>
  <footer>
    <a href="#" id="history">History</a>
    <a href="#" id="shortcuts">Shortcuts</a>
  </footer>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
